{% extends 'base.html' %}
{% block content %}<div class="container-fluid"><h2 class="mt-4">✏️ Edit Tugas</h2><div class="card shadow-sm border-0 mt-4" style="max-width:650px"><div class="card-body"><form method="POST" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input name="judul" class="form-control mb-3" value="{{ tugas.judul }}" placeholder="Judul Tugas" required><textarea name="deskripsi" class="form-control mb-3" rows="5" required>{{ tugas.deskripsi }}</textarea><input type="datetime-local" name="deadline" class="form-control mb-2" value="{{ tugas.deadline|replace(' ', 'T') }}" required><small class="text-muted d-block mb-3">Deadline baru harus masih di masa depan.</small><input type="file" name="file_tugas" class="form-control mb-2" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png"><small class="text-muted d-block mb-3">Upload file baru jika ingin mengganti lampiran. Maksimal 10 MB.</small><button class="btn btn-primary">Simpan Perubahan</button> <a href="/tugas" class="btn btn-secondary">Batal</a></form></div></div></div>{% endblock %}
