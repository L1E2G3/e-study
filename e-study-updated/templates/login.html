<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Study | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }</style>
</head>
<body>
    <div class="card p-4 shadow-sm" style="width: 100%; max-width: 400px; border-top: 4px solid #007acc;">
        <h3 class="text-center mb-4">Login E-Study</h3>
        <form method="POST" action="/login">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label fw-bold">NISN / Email / No. Telp</label>
                <input type="text" name="username" class="form-control" required autocomplete="off">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" id="inputPassword" class="form-control" required>
            </div>
            
            <!-- FITUR TAMPILKAN PASSWORD -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="showPassword" onclick="togglePassword()">
                <label class="form-check-label text-muted" for="showPassword">Tampilkan Password</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-2">Masuk</button>
            <div class="text-center mt-2">
                <small>Belum punya akun? <a href="/register" class="text-decoration-none">Daftar di sini</a></small><br>
                <small>Lupa sandi? <a href="/lupa-sandi" class="text-decoration-none text-danger">Reset di sini</a></small>
                <!-- Nanti tombol lupa sandi kita taruh di sini -->
            </div>
        </form>
    </div>

    <!-- SCRIPT JAVASCRIPT BUAT MATA PASSWORD -->
    <script>
        function togglePassword() {
            var x = document.getElementById("inputPassword");
            if (x.type === "password") { x.type = "text"; } else { x.type = "password"; }
        }
    </script>
</body>
</html>
