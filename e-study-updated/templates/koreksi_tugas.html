{% extends 'base.html' %}
{% block content %}
<div class="container-fluid"><h2 class="mt-4">✍️ Koreksi Tugas Saya</h2><p class="text-muted">Hanya tugas yang kamu buat sendiri yang tampil di sini.</p>
<div class="card shadow-sm border-0 mt-4"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover table-striped mb-0"><thead class="table-dark"><tr><th>Siswa</th><th>Tugas</th><th>Jawaban</th><th>Nilai</th><th>Komentar</th><th>Aksi</th></tr></thead><tbody>
{% for k in kumpulan %}<tr class="align-middle"><td class="fw-bold">{{ k.username }}</td><td>{{ k.judul }}</td><td><a href="{{ url_for('download_upload', filename=k.file_siswa) }}" class="btn btn-sm btn-outline-primary">📄 Buka</a></td>
<td><input form="nilai-{{ k.pengumpulan_id }}" type="number" name="nilai" class="form-control form-control-sm" value="{{ k.nilai if k.nilai is not none else '' }}" min="0" max="100" required></td>
<td><input form="nilai-{{ k.pengumpulan_id }}" type="text" name="komentar" class="form-control form-control-sm" value="{{ k.komentar or '' }}" placeholder="Catatan"></td>
<td><form id="nilai-{{ k.pengumpulan_id }}" method="POST" action="{{ url_for('beri_nilai', pengumpulan_id=k.pengumpulan_id) }}"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-success">💾 Simpan</button></form></td></tr>
{% else %}<tr><td colspan="6" class="text-center text-muted py-4">Belum ada pengumpulan untuk tugasmu.</td></tr>{% endfor %}</tbody></table></div></div></div></div>
{% endblock %}
