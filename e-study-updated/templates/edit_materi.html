{% extends 'base.html' %}
{% block content %}<div class="container-fluid"><h2 class="mt-4">✏️ Edit Materi</h2><div class="card shadow-sm border-0 mt-4" style="max-width:760px"><div class="card-body"><form method="POST" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><input name="mata_pelajaran" class="form-control mb-3" value="{{ materi.mata_pelajaran }}" placeholder="Mata Pelajaran" required><input name="kelas" class="form-control mb-3" value="{{ materi.kelas }}" placeholder="Kelas" required><input name="judul" class="form-control mb-3" value="{{ materi.judul }}" placeholder="Judul" required><textarea name="isi" class="form-control mb-3" rows="6" required>{{ materi.isi }}</textarea><input name="video_url" type="url" class="form-control mb-3" value="{{ materi.video_url }}" placeholder="Link YouTube"><input type="file" name="file_materi" class="form-control mb-2" accept=".pdf,.ppt,.pptx,.doc,.docx"><small class="text-muted d-block mb-3">Upload file baru jika ingin mengganti lampiran. Maksimal 10 MB.</small><button class="btn btn-primary">Simpan Perubahan</button> <a href="/materi" class="btn btn-secondary">Batal</a></form></div></div></div>{% endblock %}
